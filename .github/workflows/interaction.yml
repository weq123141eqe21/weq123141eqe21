name: Record profile interaction

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  record-vote:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Record interaction
        if: github.event_name == 'issues'
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          VOTER: ${{ github.event.issue.user.login }}
        run: python scripts/record_vote.py

      - name: Regenerate statistics manually
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/render_stats.py

      - name: Commit updated statistics
        run: |
          git add data.json assets/interaction-stats.svg
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update profile interaction stats"
            git push
          fi

      - name: Close valid vote issue
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          case "$ISSUE_TITLE" in
            "[vote] AI Research"|"[vote] Computer Vision"|"[vote] Long-tail Learning"|"[vote] Student"|"[vote] Collaboration")
              gh issue comment "$ISSUE_NUMBER" --body "Thanks! Your interaction has been recorded. If you already chose this option before, it was not counted twice."
              gh issue close "$ISSUE_NUMBER"
              ;;
            *)
              echo "Not a profile interaction issue; leaving it untouched."
              ;;
          esac
